name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build_release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate module manifest JSON
        run: jq . module.json > /dev/null

      - name: Get current manifest version
        id: manifest_version
        run: |
          VERSION=$(jq -r '.version' module.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get latest release version
        id: latest_release
        run: |
          if LATEST_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null); then
            VERSION="${LATEST_TAG#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve PR bump type
        id: pr_bump
        run: |
          PRS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")
          PR_NUMBER=$(jq -r '.[0].number // ""' <<< "$PRS")

          if [ -z "$PR_NUMBER" ]; then
            echo "bump=patch" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUMP=$(jq -r '
            .[0].labels
            | map(.name | ascii_downcase)
            | if index("major") then "major"
              elif index("minor") then "minor"
              else "patch"
              end
          ' <<< "$PRS")

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: next_version
        env:
          MANIFEST_VERSION: ${{ steps.manifest_version.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.latest_release.outputs.version }}
          BUMP_TYPE: ${{ steps.pr_bump.outputs.bump }}
        run: |
          version_gt() {
            [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -n 1)" = "$2" ]
          }

          bump_previous_version() {
            IFS='.' read -r MAJOR MINOR PATCH <<< "$PREVIOUS_VERSION"
            case "$BUMP_TYPE" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              *)
                PATCH=$((PATCH + 1))
                ;;
            esac
            NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          }

          if version_gt "$MANIFEST_VERSION" "$PREVIOUS_VERSION"; then
            NEXT_VERSION="$MANIFEST_VERSION"
            REASON="module.json version changed"
          else
            bump_previous_version
            if [ "$MANIFEST_VERSION" = "$PREVIOUS_VERSION" ]; then
              REASON="${BUMP_TYPE} bump from PR label"
            else
              REASON="${BUMP_TYPE} bump from latest release; stale module.json version ignored"
            fi
          fi

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Update manifest for release
        env:
          RELEASE_VERSION: ${{ steps.next_version.outputs.version }}
          RELEASE_TAG: ${{ steps.next_version.outputs.tag }}
        run: |
          jq \
            --arg version "$RELEASE_VERSION" \
            --arg url "https://github.com/$GITHUB_REPOSITORY" \
            --arg manifest "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/module.json" \
            --arg download "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/jay-helpers.zip" \
            --arg changelog "https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md" \
            --arg readme "https://github.com/$GITHUB_REPOSITORY/blob/main/README.md" \
            '.version = $version
              | .url = $url
              | .manifest = $manifest
              | .download = $download
              | .changelog = $changelog
              | .readme = $readme' \
            module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Ensure package version matches resolved release version
        env:
          RELEASE_VERSION: ${{ steps.next_version.outputs.version }}
        run: |
          jq --arg version "$RELEASE_VERSION" '.version = $version' package.json > package.tmp.json
          mv package.tmp.json package.json

          if [ -f package-lock.json ]; then
            PACKAGE_NAME=$(jq -r '.name' package.json)
            jq --arg name "$PACKAGE_NAME" --arg version "$RELEASE_VERSION" '
              .name = $name
              | .version = $version
              | .packages[""].name = $name
              | .packages[""].version = $version
            ' package-lock.json > package-lock.tmp.json
            mv package-lock.tmp.json package-lock.json
          fi

      - name: Commit resolved version to main
        env:
          RELEASE_VERSION: ${{ steps.next_version.outputs.version }}
        run: |
          if git diff --quiet -- module.json package.json package-lock.json; then
            echo "Version files already match $RELEASE_VERSION"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module.json package.json package-lock.json
          git commit -m "chore: release v$RELEASE_VERSION [skip ci]"
          git push origin HEAD:main

      - name: Get release commit
        id: release_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release archive
        run: zip -r ./jay-helpers.zip module.json LICENSE lang/ scripts/ images/ styles/ templates/

      - name: Create or update GitHub release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: ./module.json,./jay-helpers.zip
          commit: ${{ steps.release_commit.outputs.sha }}
          generateReleaseNotes: true
          tag: ${{ steps.next_version.outputs.tag }}
          name: ${{ steps.next_version.outputs.tag }}
          body: |
            Automated release from merge into main.

            Version reason: ${{ steps.next_version.outputs.reason }}.
            Source commit: ${{ steps.release_commit.outputs.sha }}
            PR: ${{ steps.pr_bump.outputs.pr_number != '' && format('#{0}', steps.pr_bump.outputs.pr_number) || 'N/A' }}
