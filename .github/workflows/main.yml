name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate module manifest JSON
        run: jq . module.json > /dev/null

      - name: Get current manifest version
        id: manifest_version
        run: |
          VERSION=$(jq -r '.version' module.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get latest release version
        id: latest_release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              const latest = await github.rest.repos.getLatestRelease({ owner, repo });
              const tag = latest.data.tag_name || '';
              const version = tag.replace(/^v/, '');
              core.setOutput('version', version);
              core.setOutput('exists', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('version', '0.0.0');
                core.setOutput('exists', 'false');
                return;
              }
              throw error;
            }

      - name: Resolve PR bump type
        id: pr_bump
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;

            const prs = await github.request('GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls', {
              owner,
              repo,
              commit_sha: sha,
              mediaType: { previews: ['groot'] },
            });

            if (!prs.data.length) {
              core.setOutput('bump', 'patch');
              core.setOutput('pr_number', '');
              return;
            }

            const pr = prs.data[0];
            const labels = (pr.labels || []).map((label) => String(label.name || '').toLowerCase());
            const hasMajor = labels.includes('major');
            const hasMinor = labels.includes('minor');

            let bump = 'patch';
            if (hasMajor) bump = 'major';
            else if (hasMinor) bump = 'minor';

            core.setOutput('bump', bump);
            core.setOutput('pr_number', String(pr.number));

      - name: Compute next version
        id: next_version
        env:
          MANIFEST_VERSION: ${{ steps.manifest_version.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.latest_release.outputs.version }}
          BUMP_TYPE: ${{ steps.pr_bump.outputs.bump }}
        run: |
          if [ "$MANIFEST_VERSION" != "$PREVIOUS_VERSION" ]; then
            NEXT_VERSION="$MANIFEST_VERSION"
            REASON="module.json version changed"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$PREVIOUS_VERSION"
            case "$BUMP_TYPE" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              *)
                PATCH=$((PATCH + 1))
                ;;
            esac
            NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            REASON="${BUMP_TYPE} bump from PR tag"
          fi

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Update manifest URLs for release
        uses: microsoft/variable-substitution@v1
        with:
          files: module.json
        env:
          version: ${{ steps.next_version.outputs.version }}
          url: https://github.com/${{ github.repository }}
          manifest: https://github.com/${{ github.repository }}/releases/latest/download/module.json
          download: https://github.com/${{ github.repository }}/releases/download/${{ steps.next_version.outputs.tag }}/jay-helpers.zip
          changelog: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md
          readme: https://github.com/${{ github.repository }}/blob/main/README.md

      - name: Ensure manifest version matches resolved release version
        env:
          RELEASE_VERSION: ${{ steps.next_version.outputs.version }}
        run: |
          jq --arg version "$RELEASE_VERSION" '.version = $version' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Ensure package version matches resolved release version
        env:
          RELEASE_VERSION: ${{ steps.next_version.outputs.version }}
        run: |
          jq --arg version "$RELEASE_VERSION" '.version = $version' package.json > package.tmp.json
          mv package.tmp.json package.json

          if [ -f package-lock.json ]; then
            PACKAGE_NAME=$(jq -r '.name' package.json)
            jq --arg name "$PACKAGE_NAME" --arg version "$RELEASE_VERSION" '
              .name = $name
              | .version = $version
              | .packages[""].name = $name
              | .packages[""].version = $version
            ' package-lock.json > package-lock.tmp.json
            mv package-lock.tmp.json package-lock.json
          fi

      - name: Commit resolved version to main
        env:
          RELEASE_VERSION: ${{ steps.next_version.outputs.version }}
        run: |
          if git diff --quiet -- module.json package.json package-lock.json; then
            echo "Version files already match $RELEASE_VERSION"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module.json package.json package-lock.json
          git commit -m "chore: release v$RELEASE_VERSION [skip ci]"
          git push origin HEAD:main

      - name: Get release commit
        id: release_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release archive
        run: zip -r ./jay-helpers.zip module.json LICENSE lang/ scripts/ images/

      - name: Create or update GitHub release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: ./module.json,./jay-helpers.zip
          commit: ${{ steps.release_commit.outputs.sha }}
          generateReleaseNotes: true
          tag: ${{ steps.next_version.outputs.tag }}
          name: ${{ steps.next_version.outputs.tag }}
          body: |
            Automated release from merge into main.

            Version reason: ${{ steps.next_version.outputs.reason }}.
            Source commit: ${{ steps.release_commit.outputs.sha }}
            PR: ${{ steps.pr_bump.outputs.pr_number != '' && format('#{0}', steps.pr_bump.outputs.pr_number) || 'N/A' }}
