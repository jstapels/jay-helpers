  pull-requests: read
      - name: Resolve merged PR labels
        id: pr_labels
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const commitSha = context.sha;
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: commitSha
            });

            if (!prs.data.length) {
              core.setOutput('has_major', 'false');
              core.setOutput('has_minor', 'false');
              core.setOutput('pr_number', '');
              core.setOutput('labels', '');
              return;
            }

            const mergedPr = prs.data.find((pr) => pr.merged_at) ?? prs.data[0];
            const labels = mergedPr.labels.map((l) => (typeof l === 'string' ? l : l.name.toLowerCase()));
            const hasMajor = labels.includes('major');
            const hasMinor = labels.includes('minor');

            core.setOutput('has_major', hasMajor ? 'true' : 'false');
            core.setOutput('has_minor', hasMinor ? 'true' : 'false');
            core.setOutput('pr_number', String(mergedPr.number));
            core.setOutput('labels', labels.join(','));

          HAS_MAJOR_LABEL: ${{ steps.pr_labels.outputs.has_major }}
          HAS_MINOR_LABEL: ${{ steps.pr_labels.outputs.has_minor }}
            if [ "$HAS_MAJOR_LABEL" = "true" ]; then
            elif [ "$HAS_MINOR_LABEL" = "true" ]; then
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate module manifest JSON
        run: jq . module.json > /dev/null

      - name: Extract version from release tag
        id: get_version
        uses: battila7/get-version-action@v2

      - name: Validate tag version matches module manifest
        env:
          TAG_VERSION: ${{ steps.get_version.outputs.version-without-v }}
        run: |
          MANIFEST_VERSION=$(jq -r '.version' module.json)
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match module.json version ($MANIFEST_VERSION)."
            exit 1
          fi

      - name: Inject release URLs into manifest
        uses: microsoft/variable-substitution@v1
        with:
          files: module.json
        env:
          url: https://github.com/${{ github.repository }}
          manifest: https://github.com/${{ github.repository }}/releases/latest/download/module.json
          download: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/jay-helpers.zip
          changelog: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md
          readme: https://github.com/${{ github.repository }}/blob/main/README.md

      - name: Create release archive
        run: zip -r ./jay-helpers.zip module.json LICENSE lang/ scripts/ images/

      - name: Upload release assets
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: ./module.json,./jay-helpers.zip
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}
            - PR: #${{ steps.pr_labels.outputs.pr_number }}
            - PR labels: ${{ steps.pr_labels.outputs.labels }}
